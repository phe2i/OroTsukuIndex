<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./styles/index.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

    <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
    <title>SheYue99</title>
</head>
<body class="flex items-center justify-center min-h-screen
            bg-gradient-to-r from-slate-700 to-slate-900
            animate-gradient"
>
    <div class="grid 
            grid-cols-2 
            grid-rows-[1fr_3fr]
            md:grid-cols-3 md:grid-rows-1
            w-full max-w-6xl
            h-screen md:h-auto
            ">

        <div id="orochiCard" class="card">
            <img id="orochiThumb" class="card-thumb">
            <h2 id="orochiEN" class="card-en"></h2>
            <p id="orochiCN" class="card-cn"></p>
            <p id="orochiSource" class="card-source"></p>
        </div>

        <div class="control flex flex-col items-center justify-center 
                    gap-4 h-full w-full max-w-xs 
                    mx-auto p-10
                    col-span-2 md:col-span-1
                    order-first md:order-none
                    ">

            <button id="randomBtn"
                class="text-white font-bold
                        text-xl md:text-2xl
                        px-6 md:px-10
                        py-4 md:py-8
                        w-full
                        rounded shadow
                        bg-gradient-to-r from-purple-700 to-indigo-600
                        hover:brightness-110 hover:shadow-lg hover:shadow-white/10"
                >
                Random
            </button>
            <div class="text-lg md:text-xl flex flex-col gap-4">
                <div class="radio-line">
                    <input type="radio" id="ingame" name="pairMode" value="ingame">
                    <label for="ingame">in-game only</label>
                </div>
                <div class="radio-line">
                    <input type="radio" id="fixed" name="pairMode" value="fixed">
                    <label for="fixed">same set only</label>
                </div>
                <div class="radio-line">
                    <input type="radio" id="diff" name="pairMode" value="diff">
                    <label for="diff">different set only</label>
                </div>
            </div>

            <button id="allBtn"
                class="text-white font-bold
                        text-lg md:text-xl
                        px-6 md:px-10
                        py-2 md:py-4
                        w-full
                        rounded shadow
                        bg-gray-600
                        hover:brightness-110 hover:shadow-lg hover:shadow-black/20"
                >
                View All
            </button>
            
        </div>

        <div id="tsukuCard" class="card glow">
            <img id="tsukuThumb" class="card-thumb">
            <h2 id="tsukuEN" class="card-en"></h2>
            <p id="tsukuCN" class="card-cn"></p>
            <p id="tsukuSource" class="card-source"></p>
        </div>
    </div>


    <div id="imageModal"
     class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50">

     <div id="galleryOverlay"
        class="absolute inset-0 hidden
            bg-black/80 z-30
            px-6 overflow-y-auto">

        <div class="sticky top-0 z-40 flex justify-end items-center py-5 mb-5 bg-black/80">
            <h2 id="galleryHeader" 
            class="absolute left-1/2 -translate-x-1/2 text-white text-xl font-bold">
                 Image Gallery
            </h2>

            <button id="closeGalleryBtn"
                class="text-white text-2xl">
                ✕
            </button>

        </div>
            <div id="galleryGrid">
        </div>
     </div>

     <div class="flex flex-col items-center max-w-[90vw] max-h-[95vh]">
        <img id="modalImg"
            class="max-h-[80vh] max-w-[90vw] rounded shadow-lg">

        <button id="prevBtn"
            class="left-5 side-btn">❮</button>

        <button id="nextBtn"
            class="right-5 side-btn">❯</button>

        <p id="modalReleaseDate"
            class="text-white mt-2">
            date
        </p>

        <div id="modalLinks" class="topic-links">
            <button id="viewGalleryBtn"
                class="small-btn btn1">
                View Gallery (2)
            </button>
            <button id="downloadImgBtn"
                class="small-btn btn2">
                <i class="fa-solid fa-download"></i>
                Download Image
            </button>
            <!-- <a href="#" class="topic-link-btn btn1">Test1</a>
            <a href="#" class="topic-link-btn btn2">Test2</a> -->
        </div>

     </div>
        
    </div>

    <!-- switch page btn -->
    <a id="modelViewerBtn"
    href="./modelViewer.html"
    class="model-viewer-float"
    aria-label="Open Model Viewer"
    title="Open Model Viewer">

        <!-- Idle -->
        <img
            id="modelViewerStatic"
            src="./images/UI/modelViewer-0.png"
            alt="Model Viewer"
        >

        <!-- Animated GIF -->
        <img
            id="modelViewerGif"
            src="./images/UI/modelViewer.gif"
            alt=""
        >
    </a>

    <div id="allModal"
        class="fixed inset-0 bg-black/70 hidden items-center justify-center z-40">

        <div class="main-bg w-[90vw] max-w-5xl max-h-[90vh] 
        rounded shadow-lg
        colourScroll">

            <div>
                <div class="char-category category-header"
                    onclick="toggleSection('oroSection', this)">
                    <span class="category-arrow">
                        ▼
                    </span>
                    <span>Orochi</span>
                </div>
                <div id="oroSection" class="grid grid-cols-2 md:grid-cols-4 gap-4 m-2"></div>
            </div>

            <div>
                <div class="char-category category-header"
                    onclick="toggleSection('tsukuSection', this)">
                    <span class="category-arrow">
                        ▼
                    </span>
                    <span>Tsukuyomi</span>
                </div>
                <div id="tsukuSection" class="grid grid-cols-2 md:grid-cols-4 gap-4 m-2"></div>
            </div>

        </div>
    </div>

    <script src="./scripts/index.js"></script>
</body>
</html>
