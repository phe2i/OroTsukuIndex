<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Model Viewer</title>
    <link rel="icon" type="image/x-icon" href="./images/favicon.ico">

    <link rel="stylesheet" href="./styles/global.css">
    <!-- <link rel="stylesheet" href="./styles/index.css"> -->
    <link rel="stylesheet" href="./styles/modelViewer.css">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

</head>

<body>
    <main class="model-viewer-page">

        <!-- LEFT PANEL -->
        <aside id="modelSidebar" class="model-sidebar">

            <section class="model-section">
                <header class="model-list-header">
                    <h1>
                        <img src="./images/favicon.ico">
                        Model List
                    </h1>
                    <p>Pinned 3D models are saved in browser storage for 30 days.</p>
                    <!-- Search -->
                    <div class="model-search">
                        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"
                        >
                            <circle cx="11" cy="11" r="7"
                            ></circle>

                            <line
                                x1="16.5"   y1="16.5"
                                x2="21"     y2="21"
                            ></line>
                        </svg>

                        <input id="modelSearch"
                            type="search"
                            placeholder="Search models..."
                            autocomplete="off"
                        >
                    </div>
                </header>
                <section id="modelList" class="model-list"></section>
            </section>

            <div id="verticalResizeHandle"
                class="vertical-resize-handle"
                title="Resize model/material panels"
            ></div>

            <section class="material-panel">
                <div class="material-header">
                    <h2>
                        <span class="material-symbols-outlined">
                            stacks
                        </span>
                        Material List
                    </h2>

                    <div class="material-actions">
                        <button id="showAllMaterials"
                            class="material-action"
                            title="Show all materials"
                        >
                            A
                        </button>

                        <button id="reverseMaterials"
                            class="material-action"
                            title="reverse material visibility"
                        >
                            R
                        </button>
                    </div>
                </div>

                <div id="materialList" class="material-list">
                    <div class="alt-text viewer-empty">
                        Select a model
                    </div>
                </div>
            </section>

            <div id="horizontalResizeHandle"
                class="horizontal-resize-handle"
                title="Resize sidebar"
            ></div>

        </aside>

        <!-- switch page btn -->
        <a href="./"
            id="modelViewerBtn"
            class="model-viewer-float"
            aria-label="Open Skin List"
            title="Open Skin List">

            <!-- Idle -->
            <img
                id="modelViewerStatic"
                src="./images/UI/skinViewer-0.png"
                alt="Model Viewer"
            >
            <!-- Animated GIF -->
            <img
                id="modelViewerGif"
                src="./images/UI/skinViewer.gif"
                alt=""
            >
        </a>

        <section class="viewer-area">
            <!-- THREE.JS VIEWPORT -->
            <div
                id="modelViewport"
                class="model-viewport"
            >
                <div id="viewerLoading"
                    class="loading hidden"
                >
                    <div class="loader"></div>
                    <div class="alt-text">Loading...</div>
                </div>

                <div id="viewerEmpty"
                    class="alt-text viewer-empty"
                >
                    Select a model
                </div>

                <aside id="pinnedBar" class="pinned-bar" aria-label="Pinned models">
                    <div class="pinned-bar-header">
                        <button type="button" class="pinned-clear-button">
                            clear all
                        </button>
                    </div>
                    <div class="pinned-model-list colourScroll" aria-label="Pinned models"></div>
                </aside>

                <!-- Viewer controls -->
                <div class="viewer-controls">

                    <input id="backgroundColor" title="Change background color"
                        class="background-color-picker viewer-button"
                        type="color"
                        value="#c3c3c3"
                    >

                    <button id="resetCamera" title="Reset Camera"
                        class="viewer-button"
                    >
                        <span class="material-symbols-outlined">
                        cameraswitch
                        </span>
                    </button>

                    <button id="lightSettings" title="Light Settings"
                        class="viewer-button"
                    >
                        <span class="material-symbols-outlined">
                        light_mode
                        </span>
                    </button>

                    <div id="lightPanel" class="light-panel">

                        <div class="panel-header-with-button">
                            <span>Light Settings</span>
                            <button id="resetLightButton" title="Reset lighting" class="inline-button material-symbols-outlined">
                                reset_settings
                            </button>
                        </div>

                        <!-- ishouldvejustusedreactomg -->
                        <!-- Distance -->
                        <div class="light-control">

                            <div class="light-control-header">
                                <label for="lightDistance">
                                    Distance
                                </label>
                                <span id="lightDistanceValue">
                                    20.00
                                </span>
                            </div>
                            <input id="lightDistance"
                                type="range"
                                min="0"
                                max="300"
                                step="10"
                                value="20"
                            >
                        </div>

                        <!-- Intensity -->
                        <div class="light-control">
                            <div class="light-control-header">
                                <label for="lightIntensity">
                                    Intensity
                                </label>
                                <span id="lightIntensityValue">
                                    3.00
                                </span>
                            </div>
                            <input id="lightIntensity"
                                type="range"
                                min="0"
                                max="5"
                                step="0.05"
                                value="3"
                            >
                        </div>

                        <!-- Ambient -->
                        <div class="light-control">
                            <div class="light-control-header">
                                <label for="ambientLight">
                                    Ambient
                                </label>
                                <span id="ambientLightValue">
                                </span>
                            </div>
                            <input
                                id="ambientLight"
                                type="range"
                                min="0"
                                max="100"
                                step="1"
                                value="0"
                            >
                        </div>

                        <!-- Horizontal -->
                        <div class="light-control">
                            <div class="light-control-header">
                                <label for="lightHorizontal">
                                    Horizontal
                                </label>
                                <span id="lightHorizontalValue">
                                </span>
                            </div>
                            <input id="lightHorizontal"
                                type="range"
                                min="0"
                                max="360"
                                step="1"
                                value="45"
                            >
                        </div>

                        <!-- Vertical -->
                        <div class="light-control">
                            <div class="light-control-header">
                                <label for="lightVertical">
                                    Vertical
                                </label>
                                <span id="lightVerticalValue">
                                </span>
                            </div>
                            <input id="lightVertical"
                                type="range"
                                min="-60"
                                max="90"
                                step="1"
                                value="0"
                            >
                        </div>

                        <!-- Rimlight -->
                        <!-- https://threejsroadmap.com/blog/rim-lighting-shader -->
                        <div class="light-control">
                            <div class="light-control-header">
                                <label for="rimIntensity">
                                    Rim Intensity
                                </label>
                                <span id="rimIntensityValue">
                                </span>
                            </div>
                            <input id="rimIntensity"
                                type="range"
                                min="0"
                                max="10"
                                step="0.5"
                                value="0"
                            >
                        </div>
                        <div class="light-control">
                            <div class="light-control-header">
                                <label for="rimPower">
                                    Rim Power
                                </label>
                                <span id="rimPowerValue">
                                </span>
                            </div>
                            <input id="rimPower"
                                type="range"
                                min="0"
                                max="10"
                                step="0.5"
                                value="0"
                            >
                        </div>
                        <!-- https://codepen.io/rogie/pen/dqweaE -->
                        <div class="light-control">
                            <div class="light-control-header">
                                <label for="rimColor">
                                    Rim Color
                                </label>
                                <span id="rimColorValue">
                                </span>
                            </div>
                            <input id="rimColor" class="color-range"
                                type="range"
                                min="0"
                                max="100"
                                step="1"
                                value="0"
                            >
                        </div>
                    </div>

                    <button id="downloadButton" title="Save as PNG"
                        class="viewer-button"
                    >
                        <span class="material-symbols-outlined">
                        photo_camera_back
                        </span>
                    </button>

                    <button id="modelViewerPiPButton" title="Open the 3D viewer in a floating window"
                        class="viewer-button pip-button"
                    >
                        <span class="material-symbols-outlined">
                        pip
                        </span>
                    </button>

                </div>
            <!-- THREE.JS VIEWPORT -->
            </div>

        </section>

    </main>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
        }
    }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/tinycolor2@1.6.0/cjs/tinycolor.js"></script>

    <script type="module" src="./scripts/global.js"></script>
    <script type="module" src="./scripts/modelData_OroTsuku.js"></script>
    <script type="module" src="./scripts/modelViewer.js"></script>
    <script type="module" src="./scripts/pipViewer.js"></script>

</body>

</html>
